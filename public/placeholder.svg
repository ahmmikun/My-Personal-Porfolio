<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0f1117" />
    </linearGradient>
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffd300" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <linearGradient id="glow-y" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd300" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffd300" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffd300" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />
  <rect width="800" height="450" fill="url(#cyber-grid)" />

  <!-- Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#ffd300" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <path d="M 770 50 L 770 30 L 750 30" stroke="#ffd300" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <path d="M 30 400 L 30 420 L 50 420" stroke="#ffd300" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <path d="M 770 400 L 770 420 L 750 420" stroke="#ffd300" stroke-width="2" stroke-opacity="0.6" fill="none" />

  <!-- Decorative Scanlines -->
  <line x1="30" y1="30" x2="770" y2="30" stroke="#ffd300" stroke-opacity="0.15" stroke-width="1" />
  <line x1="30" y1="420" x2="770" y2="420" stroke="#ffd300" stroke-opacity="0.15" stroke-width="1" />

  <!-- Center Holographic Module -->
  <rect x="250" y="125" width="300" height="200" rx="4" fill="#000000" fill-opacity="0.6" stroke="#ffd300" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6 4" />
  
  <!-- Center Icon (Cyber Chip / Terminal) -->
  <g transform="translate(370, 165)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#121318" stroke="#ffd300" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 18 24 L 28 30 L 18 36" stroke="#ffd300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="32" y1="36" x2="42" y2="36" stroke="#ffd300" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Status Text -->
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffd300" letter-spacing="3">
    [ SYSTEM // IMAGE PENDING ]
  </text>
  <text x="400" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888899" letter-spacing="1.5">
    VISUAL DATA ASSET SYNCHRONIZING
  </text>

  <!-- Glowing Axis Lines -->
  <line x1="200" y1="225" x2="250" y2="225" stroke="url(#glow-y)" stroke-width="2" />
  <line x1="550" y1="225" x2="600" y2="225" stroke="url(#glow-y)" stroke-width="2" />
</svg>
